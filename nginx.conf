server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;
    gzip_min_length 512;

    # статика — длинный кэш
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # index.html — без кэша, чтобы правки видны сразу
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
